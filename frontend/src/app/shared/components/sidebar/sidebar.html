<aside class="sidebar" role="navigation" [style.width]="sidebarWidth" [class.sidebar--expanded]="expanded"
  aria-label="Menu lateral">
  <div class="container__logo" [class.container__logoExpanded]="expanded" [class.container__logoCollapsed]="!expanded">
    <div class="content__logo">
      <div class="logo">
        <img src="assets/images/logo.png" alt="Logo do Caderno Inteligente" />
      </div>
    </div>

    <button type="button" class="toggleButton" [class.toggleButtonExpanded]="expanded"
      [class.toggleButtonCollapsed]="!expanded" (click)="toggleExpanded.emit()" [attr.aria-expanded]="expanded"
      [attr.aria-label]="expanded ? 'Recolher menu lateral' : 'Expandir menu lateral'">
      <span class="iconArrow" [class.toggleIconExpanded]="expanded" [class.toggleIconCollapsed]="!expanded"
        aria-hidden="true">

        <app-icon name="chevron-left" size="16" />
      </span>
    </button>
  </div>

  <nav class="nav" [class.navExpanded]="expanded" [class.navCollapsed]="!expanded" aria-label="Navegação principal">
    @for (item of items; track item.key) {
    <a [routerLink]="item.href" class="navItem" [class.navItemExpanded]="expanded" [class.navItemCollapsed]="!expanded"
      [class.navItemActive]="item.key === activeItem" [attr.aria-current]="item.key === activeItem ? 'page' : null"
      [attr.title]="!expanded ? item.label : null">
      <span class="icon" [class.iconActive]="item.key === activeItem" aria-hidden="true">
        <app-icon [name]="item.iconClass" size="20" />
      </span>
      <span class="label">{{ item.label }}</span>
    </a>
    }
  </nav>

  <div class="sidebarFooter" [class.sidebarFooterExpanded]="expanded" [class.sidebarFooterCollapsed]="!expanded">
    <a routerLink="/settings" class="navItem sidebarFooter__link" [class.navItemExpanded]="expanded"
      [class.navItemCollapsed]="!expanded" [attr.title]="!expanded ? 'Configurações' : null">
      <span class="icon" aria-hidden="true">
        <app-icon name="settings" size="20" />
      </span>
      <span class="label">Configurações</span>
    </a>
  </div>
</aside>
